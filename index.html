<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Client — Lab 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Клиент публичного API (JSONPlaceholder)</h1>
            <p>Lab 6: async/await, Fetch, REST, Promise.all</p>
        </header>

        <section class="card stats-card">
            <h2>Статистика платформы (Promise.all)</h2>
            <div id="statsContainer" class="stats-grid">
                <p class="loading-text">Загрузка сводных данных...</p>
            </div>
        </section>

        <section class="card">
            <div class="controls-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Поиск по заголовку поста...">
                    <button id="searchBtn" class="btn btn-primary">Найти</button>
                </div>
                <button id="resetBtn" class="btn btn-secondary">Сбросить</button>
            </div>
        </section>

        <div class="content-grid">
            <section class="card list-section">
                <h2>Список постов</h2>
                <div id="loadingIndicator" class="spinner-container" style="display: none;">
                    <div class="spinner"></div>
                    <p>Загрузка данных...</p>
                </div>
                <div id="errorContainer" class="error-msg" style="display: none;"></div>
                <div id="postsList" class="posts-list"></div>
            </section>

            <section class="card details-section">
                <h2>Детали выбранного поста</h2>
                <div id="detailsContainer" class="details-content">
                    <p class="placeholder-text">Выберите пост из списка слева, чтобы посмотреть подробную информацию и комментарии.</p>
                </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
